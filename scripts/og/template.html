<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: Archivo, sans-serif; color: #f4f1ec; background: #0e0d0c; }
  .scene { position: absolute; inset: 0; background: url("scene.png") center / cover no-repeat; }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(14,13,12,0.9) 0%, rgba(14,13,12,0.74) 32%, rgba(14,13,12,0.28) 54%, rgba(14,13,12,0) 70%),
      linear-gradient(0deg, rgba(14,13,12,0.55) 0%, rgba(14,13,12,0) 30%);
  }
  .copy { position: absolute; left: 64px; top: 58px; bottom: 54px; width: 600px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .brand svg { border-radius: 10px; box-shadow: 0 0 0 1px rgba(236,211,171,0.18); }
  .eyebrow { margin-top: 52px; font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: 0.18em; text-transform: uppercase; color: #c9a877; }
  h1 { margin-top: 18px; font-family: "Instrument Serif", serif; font-weight: 400; font-size: 62px; line-height: 1.02; letter-spacing: -0.012em; }
  h1 em { color: #ecd3ab; }
  .steps { margin-top: auto; display: flex; align-items: center; gap: 14px; font-family: "Geist Mono", monospace; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(244,241,236,0.72); }
  .steps i { width: 22px; height: 1px; background: rgba(236,211,171,0.5); }
  .steps b { font-weight: 500; color: #ecd3ab; }
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="scrim"></div>
  <div class="copy">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#050506"/><g fill="#e0c398"><path d="M21.2 28.2 L29.0 31.8 L50.8 90.2 L46.2 96.8 Z"/><path d="M45.0 24.6 C63.0 22.2 74.6 30.2 72.6 42.2 C70.8 51.6 62.6 57.0 53.6 57.8 C61.0 51.8 66.2 44.6 64.8 37.4 C63.4 30.6 55.4 25.8 45.0 24.6 Z"/><path d="M51.0 59.4 C70.4 57.2 82.4 66.4 79.8 79.4 C77.4 91.0 66.0 96.6 54.4 95.6 C64.8 90.0 71.4 81.4 69.8 72.6 C68.2 64.6 61.4 60.4 51.0 59.4 Z"/></g></svg>
      VelaBuilt
    </div>
    <div class="eyebrow">Interactive demo · Contractors</div>
    <h1>What if your customers could <em>experience your work</em> before they ever called you?</h1>
    <div class="steps"><b>Explore</b><i></i><span>Configure</span><i></i><span>Estimate</span><i></i><span>Book</span></div>
  </div>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Geist+Mono:wght@500&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; font-family: Archivo, sans-serif; color: #151412; background: #efe9e0; }
  .scene { position: absolute; inset: 0; background: url("scene.png") center / cover no-repeat; }
  .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(244,241,236,0.97) 0%, rgba(244,241,236,0.9) 34%, rgba(244,241,236,0.35) 52%, rgba(244,241,236,0) 64%); }
  .copy { position: absolute; left: 64px; top: 64px; bottom: 60px; width: 560px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .brand svg { border-radius: 10px; }
  .eyebrow { margin-top: 56px; font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: 0.16em; text-transform: uppercase; color: #7a4f15; font-weight: 500; }
  h1 { margin-top: 16px; font-size: 76px; line-height: 0.98; font-weight: 560; letter-spacing: -0.04em; }
  p { margin-top: 22px; font-size: 25px; line-height: 1.3; color: #34322e; letter-spacing: -0.01em; max-width: 520px; }
  .steps { margin-top: auto; display: flex; gap: 10px; font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; color: #34322e; }
  .steps span { padding: 9px 14px; border-radius: 999px; background: rgba(250,248,245,0.9); border: 1px solid rgba(22,21,19,0.16); }
  .steps span.on { background: #151412; color: #e0c398; border-color: #151412; }
  .split { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #fff; box-shadow: 0 0 0 1px rgba(21,20,18,0.12), 0 0 18px rgba(0,0,0,0.3); }
  .knob { position: absolute; top: 300px; width: 48px; height: 48px; margin-left: -24px; border-radius: 50%; background: #fff; border: 3px solid #d49a4e; box-shadow: 0 8px 20px rgba(0,0,0,0.3); display: grid; place-items: center; font: 600 18px Archivo, sans-serif; color: #151412; }
  .tag { position: absolute; font-family: "Geist Mono", monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; background: rgba(21,20,18,0.78); color: #fff; }
  .card { position: absolute; right: 44px; bottom: 44px; width: 300px; padding: 18px 20px; border-radius: 18px; background: rgba(247,245,241,0.95); box-shadow: 0 20px 40px -18px rgba(0,0,0,0.35); border: 1px solid rgba(22,21,19,0.12); }
  .card small { display: block; font-family: "Geist Mono", monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #5a564f; }
  .card strong { display: block; margin-top: 6px; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  .card em { display: block; margin-top: 4px; font-style: normal; font-size: 16px; color: #5a564f; }
  .card .cta { margin-top: 14px; padding: 12px 16px; border-radius: 999px; background: #151412; color: #f4f1ec; font-size: 17px; font-weight: 600; text-align: center; }
</style>
</head>
<body>
  <div class="scene"></div>
  <div class="scrim"></div>
  <div class="split" style="left: 720px"></div>
  <div class="knob" style="left: 720px">‹›</div>
  <span class="tag" style="left: 624px; top: 96px">Before</span>
  <span class="tag" style="left: 732px; top: 96px">After</span>
  <div class="copy">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#050506"/><g fill="#e0c398"><path d="M21.2 28.2 L29.0 31.8 L50.8 90.2 L46.2 96.8 Z"/><path d="M45.0 24.6 C63.0 22.2 74.6 30.2 72.6 42.2 C70.8 51.6 62.6 57.0 53.6 57.8 C61.0 51.8 66.2 44.6 64.8 37.4 C63.4 30.6 55.4 25.8 45.0 24.6 Z"/><path d="M51.0 59.4 C70.4 57.2 82.4 66.4 79.8 79.4 C77.4 91.0 66.0 96.6 54.4 95.6 C64.8 90.0 71.4 81.4 69.8 72.6 C68.2 64.6 61.4 60.4 51.0 59.4 Z"/></g></svg>
      VelaBuilt
    </div>
    <div class="eyebrow">Interactive demo</div>
    <h1>The Future of Contractor Sales</h1>
    <p>Customers see, price and book your work — before they ever call you.</p>
    <div class="steps"><span class="on">Design</span><span>Estimate</span><span>Book</span></div>
  </div>
  <div class="card">
    <small>New roof · sample estimate</small>
    <strong>$31k – $43k</strong>
    <em>Standing-seam metal · Matte black</em>
    <div class="cta">Request free inspection →</div>
  </div>
</body>
</html>
